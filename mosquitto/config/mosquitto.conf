# Cấu hình Mosquitto MQTT Broker cơ bản cho môi trường phát triển
listener 1883
listener 9001
protocol websockets

# Cho phép kết nối không cần auth khi dev - BẬT auth thật trước khi triển khai thực tế
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
